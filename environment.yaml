name: mimicmotion
channels:
  - pytorch
  - nvidia
dependencies:
  - python=3.11
  - pytorch=2.0.1
  - torchvision=0.15.2
  - pytorch-cuda=11.7
  - pip
  - pip:
    # PEFT >= 0.16 imports HybridCache, which was added in Transformers 4.42.
    # Keep this aligned with the ComfyUI wrapper environment (4.42.3).
    - diffusers>=0.29.0
    - transformers>=4.42.3,<5
    - decord==0.6.0
    - einops
    - omegaconf
